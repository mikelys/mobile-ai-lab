<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobile AI Developer Lab</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #0b1220; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    main { max-width: 600px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .logo { font-size: 18px; font-weight: 700; }
    .tag { background: #14532d; color: #86efac; padding: 6px 12px; border-radius: 20px; font-size: 12px; }
    .eyebrow { color: #94a3b8; font-size: 12px; letter-spacing: 1.5px; }
    h1 { font-size: 32px; margin: 14px 0; }
    p { color: #cbd5e1; line-height: 1.6; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 28px 0; }
    .card { background: #1e293b; border-radius: 14px; padding: 20px; }
    .number { font-size: 32px; font-weight: 700; margin: 12px 0 4px; }
    .label { color: #cbd5e1; font-size: 13px; }
    .project { margin-top: 24px; }
    .project h2 { font-size: 18px; margin: 0; }
    footer { margin-top: 40px; color: #64748b; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo">⌘ Mobile AI Lab</div>
      <span class="tag">v1.0</span>
    </header>
    <div class="eyebrow">YOUR PERSONAL DEVELOPER DASHBOARD</div>
    <h1>Hello, Developer! 👋</h1>
    <p>Your coding journey starts here.</p>
    <div class="stats">
      <div class="card">
        <div>📁</div>
        <div class="number">1</div>
        <div class="label">Active Project</div>
      </div>
      <div class="card">
        <div>✅</div>
        <div class="number">1</div>
        <div class="label">Milestone</div>
      </div>
    </div>
    <section class="card project">
      <h2>My First Project</h2>
      <p>Build and deploy a website using only an iPhone.</p>
      <span class="tag">In Progress</span>
    </section>
    <footer>Built with ChatGPT + GitHub · Mobile AI Lab</footer>
  </main>
</body>
</html>
